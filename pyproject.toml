[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atalhar"
version = "0.1.0"
description = "A IA para de repetir o caminho caro: detecta tarefas repetidas, pergunta a voce e troca por ferramenta, script ou API que custa menos token, com teste e economia medida."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = { text = "MIT" }
authors = [{ name = "Yago Tomaz" }]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
atalhar = "atalhar.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["atalhar*"]